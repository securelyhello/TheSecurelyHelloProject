name: securelyhello
description: "Securely Hello — P2P encrypted chat. The server only ever sees ciphertext."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend: HTTP + WebSocket client for server/ (see README)
  http: ^1.6.0

  # P2P Transport
  flutter_webrtc: ^1.4.1

  # Cryptography (NaCl — Ed25519 + X25519)
  pinenacl: ^0.6.0
  crypto: ^3.0.6

  # Local Storage
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.4.6 # Linux / Windows desktop
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4

  # State Management
  provider: ^6.1.5+1

  # Environment
  flutter_dotenv: ^6.0.1

  # UI
  lucide_icons_flutter: 3.1.14

  # Notifications (push is optional: only used when Firebase is configured)
  flutter_local_notifications: ^23.0.2
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0

  # App lock (biometrics on Android / iOS / macOS / Windows)
  local_auth: ^3.0.2

  # Attachments
  file_picker: ^13.4.0
  mime: ^2.0.0

  # Utilities
  uuid: ^4.5.3
  intl: ^0.20.2
  path: ^1.9.1
  flutter_secure_storage: ^11.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  share_plus: ^13.3.1
  app_links: ^7.2.2
  flutter_contacts: ^2.6.0
  record: 7.1.2
  audioplayers: 6.8.1
  image: 4.13.1
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - docs/legal/
    - assets/brand/

  # Bundled typefaces (SIL OFL, licences in assets/fonts); nothing is
  # fetched at run time.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: SourceCodePro
      fonts:
        - asset: assets/fonts/SourceCodePro-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceCodePro-SemiBold.ttf
          weight: 600

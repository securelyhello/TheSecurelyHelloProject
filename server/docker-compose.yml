# Production stack for Coolify (build pack: Docker Compose, base directory /server).
# Coolify attaches the domain to `app` on port 8787; nothing publishes host ports.
#
# Set in Coolify's environment variables (never commit them):
#   DATABASE_URL   Neon pooled connection string (required)
#   MIGRATION_DATABASE_URL   optional, Neon direct connection string
services:
  app:
    build: .
    restart: unless-stopped
    init: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the Neon pooled connection string}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/0
      PORT: "8787"
      HOST: 0.0.0.0
      TRUST_PROXY: ${TRUST_PROXY:-1}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # E-mail codes (verification, password reset). Without SMTP_URL, e-mail
      # verification is optional and password reset is unavailable.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      EMAIL_VERIFICATION: ${EMAIL_VERIFICATION:-}
      # Push wake-ups (optional): FCM service-account JSON (inline or base64).
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      # Moderation API (/api/admin/*); at least 32 random characters.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Encrypts two-step verification secrets at rest; keep it with your backups.
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-}
      # Invite link prefix: the website's /i/ page.
      INVITE_BASE_URL: ${INVITE_BASE_URL:-}
      POW_BITS: ${POW_BITS:-18}
      # Where encrypted attachments are kept: postgres | filesystem | s3.
      # filesystem stores them on this VPS in the "attachments" volume below.
      ATTACHMENT_STORAGE: ${ATTACHMENT_STORAGE:-filesystem}
      ATTACHMENT_DIR: /data/attachments
      # For ATTACHMENT_STORAGE=s3 (e.g. MinIO, AWS, R2):
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      ATTACHMENT_MAX_MB: ${ATTACHMENT_MAX_MB:-16}
      ATTACHMENT_TTL_DAYS: ${ATTACHMENT_TTL_DAYS:-30}
      ATTACHMENT_QUOTA_MB: ${ATTACHMENT_QUOTA_MB:-512}
      # Prometheus scrape token for GET /metrics (unset: no metrics route).
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # TURN relay for calls (see DEPLOY.md, Calls and TURN).
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_TTL_HOURS: ${TURN_TTL_HOURS:-12}
    volumes:
      - attachments:/data/attachments
    expose:
      - "8787"
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 384M

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # noeviction: when full, writes fail loudly (the API answers 503/429)
    # instead of silently dropping queued messages. Every key has a TTL, so
    # memory is reclaimed by expiry. AOF keeps the queue across restarts.
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320M

  # Optional TURN relay: docker compose --profile turn up -d
  coturn:
    image: coturn/coturn:4.6.3
    profiles: [turn]
    restart: unless-stopped
    network_mode: host
    command:
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?set TURN_SECRET}
      - --realm=${TURN_REALM:?set TURN_REALM, e.g. turn.example.com}
      - --external-ip=${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP to the public IP}
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      # Never relay to private networks (keeps TURN from reaching the host's LAN).
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --total-quota=300
      - --user-quota=12
      - --log-file=stdout
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  redis-data:
  attachments:

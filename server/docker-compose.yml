# Production stack for Coolify (build pack: Docker Compose, base directory /server).
# Coolify attaches the domain to `app` on port 8787; nothing publishes host ports.
#
# Set in Coolify's environment variables (never commit them):
#   DATABASE_URL   Neon pooled connection string (required)
#   MIGRATION_DATABASE_URL   optional, Neon direct connection string
#   EMAIL_PROVIDER / EMAIL_FROM / EMAIL_API_KEY / EMAIL_DAILY_CAP
#                  transactional e-mail (EMAIL_PROVIDER must be resend or brevo to send;
#                  unset/log = dry-run, codes are not delivered)
#   CODE_HMAC_KEY  HMAC key for e-mail code hashes (openssl rand -hex 32);
#                  unset = random per process, a restart invalidates live codes
#   TURN_SECRET / TURN_URLS / TURN_TTL_SECONDS
#                  coturn REST credentials handed out by GET /api/turn (unset = STUN only)
services:
  app:
    build: .
    restart: unless-stopped
    init: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to the Neon pooled connection string}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/0
      PORT: "8787"
      HOST: 0.0.0.0
      TRUST_PROXY: ${TRUST_PROXY:-1}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_DAILY_CAP: ${EMAIL_DAILY_CAP:-90}
      CODE_HMAC_KEY: ${CODE_HMAC_KEY:-}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_TTL_SECONDS: ${TURN_TTL_SECONDS:-3600}
    expose:
      - "8787"
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 384M

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # noeviction: when full, writes fail loudly (the API answers 503/429)
    # instead of silently dropping queued messages. Every key has a TTL, so
    # memory is reclaimed by expiry. AOF keeps the queue across restarts.
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320M

volumes:
  redis-data:

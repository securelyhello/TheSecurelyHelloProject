name: CI

on:
  push:
  pull_request:

env:
  FLUTTER_VERSION: 3.44.9 # Dart 3.12.2, matches pubspec.lock

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sh
          POSTGRES_PASSWORD: sh_dev_password
          POSTGRES_DB: securelyhello
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U sh -d securelyhello" --health-interval 2s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ['56379:6379']
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  flutter:
    name: Analyze + unit/widget tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: python3 tools/fetch_fonts.py
      # .env is gitignored but bundled as an asset, so it must exist to build.
      - run: cp .env.example .env
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  integration:
    name: Integration tests (Linux, two real clients)
    runs-on: ubuntu-24.04
    needs: [server, flutter]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sh
          POSTGRES_PASSWORD: sh_dev_password
          POSTGRES_DB: securelyhello
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U sh -d securelyhello" --health-interval 2s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ['56379:6379']
    env:
      DATABASE_URL: postgresql://sh:sh_dev_password@127.0.0.1:55432/securelyhello
      REDIS_URL: redis://127.0.0.1:56379/0
      TRUST_PROXY: '0'
      MIGRATE_ON_START: '1'
      # E-mails (verification codes) land here; the UI test reads them.
      MAIL_TRANSPORT: file
      MAIL_FILE_DIR: /tmp/sh_mail
      # Both integration suites sign up from this one address.
      SIGNUPS_PER_IP_PER_DAY: '100'
      AUTH_PER_IP_PER_10MIN: '200'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux desktop + headless display/audio dependencies
        # libwebrtc aborts if it cannot open an audio device, so a PulseAudio
        # null sink stands in for a sound card.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev liblzma-dev xvfb dbus-x11 pulseaudio \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Start server
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          nohup node src/index.js > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8787/healthz && exit 0; sleep 1; done
          echo "server did not become healthy"; cat "$RUNNER_TEMP/server.log"; exit 1
      - name: Start virtual audio
        run: |
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=dummy
      - run: python3 tools/fetch_fonts.py
      - run: |
          cp .env.example .env
          sed -i 's#^API_BASE_URL=.*#API_BASE_URL=http://127.0.0.1:8787#' .env
          flutter pub get
      - name: End-to-end chat (P2P, receipts, relay)
        run: xvfb-run -a dbus-run-session -- flutter test integration_test/e2e_chat_test.dart -d linux --dart-define=MAIL_DIR=/tmp/sh_mail
      - name: UI walkthrough
        run: xvfb-run -a -s "-screen 0 1600x1000x24" dbus-run-session -- flutter test integration_test/ui_flow_test.dart -d linux
      - name: Upload screenshots and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-output
          path: |
            /tmp/sh_shots/
            ${{ runner.temp }}/server.log
          if-no-files-found: ignore

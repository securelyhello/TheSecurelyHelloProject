name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # weekly: new advisories, longer fuzzing

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (server runtime dependencies)
        working-directory: server
        run: npm audit --omit=dev --audit-level=high
      - name: OSV scan (pubspec.lock and package-lock.json)
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v1.9.2 \
            --lockfile=/src/pubspec.lock --lockfile=/src/server/package-lock.json

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The repository's config and ignore list are passed explicitly: the
      # container's working directory isn't the repository. --verbose names
      # the rule, file and line of a finding; --redact hides the value.
      - run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git /repo
          --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore
          --redact --verbose --no-banner

  codeql:
    name: CodeQL (server)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # the analyze step reads its own workflow run
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended
          config: |
            paths: [server/src]
      # Uploading to code scanning needs GitHub Advanced Security, which
      # this repository doesn't have; keep the results here and fail on any.
      - uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: codeql-results
      - name: Fail on CodeQL findings
        run: |
          n=$(jq '[.runs[].results[]] | length' codeql-results/*.sarif)
          jq -r '.runs[].results[] | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' codeql-results/*.sarif
          echo "CodeQL findings: $n"
          test "$n" -eq 0

  fuzz:
    name: Long fuzz run
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sh
          POSTGRES_PASSWORD: sh_dev_password
          POSTGRES_DB: securelyhello
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U sh -d securelyhello" --health-interval 2s --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ['56379:6379']
    env:
      FUZZ_SEED: ${{ github.run_id }}
      FUZZ_ROUNDS: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: server
        run: npm ci --no-audit --no-fund && node --test test/fuzz.test.js
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
      - run: cp .env.example .env && flutter pub get
      - run: flutter test test/decoder_fuzz_test.dart
        env:
          FUZZ_ROUNDS: 50000
